[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "max-support-bot"
version = "0.1.0"
description = "Anonymized MAX support bot portfolio project"
requires-python = ">=3.11"
dependencies = ["certifi>=2026.5.20", "fastapi>=0.116.0", "httpx>=0.28.0", "python-dotenv>=1.0.1", "uvicorn>=0.35.0"]

[tool.setuptools]
py-modules = ["main", "config", "constants", "bootstrap"]

[tool.setuptools.packages.find]
include = ["maxbot*"]

[tool.setuptools.package-data]
maxbot = ["certs/*.pem"]
